[package]
name = "cmmrs"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "control-my-monitor — a terminal UI for controlling DDC/CI monitors, vendor-agnostic."
license = "MIT"
repository = "https://github.com/kauefontes/cmmrs"
homepage = "https://github.com/kauefontes/cmmrs"
readme = "README.md"
keywords = ["ddc", "ddcutil", "monitor", "tui", "brightness"]
categories = ["command-line-utilities"]

[[bin]]
name = "cmmrs"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
# Matches the version ratatui 0.30's own CrosstermBackend pulls in
# internally (ratatui-crossterm) — without this pin, cargo happily
# builds two separate crossterm versions side by side (0.28 for us,
# 0.29 for ratatui's internals), which still compiles since the two
# never exchange typed values, but is needless duplication.
crossterm = "0.29"
# Shader-like frame effects (fade/sweep/flash) — see ui.rs. Needs
# ratatui 0.30+: its production code depends on ratatui-core, which is
# only type-compatible with the ratatui crate from that split onward.
tachyonfx = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "5"
thiserror = "1"
# Just the facade (log::info!/warn!/etc as no-ops until a logger is
# installed) — the logger itself is hand-rolled in `logging.rs` rather
# than pulling in env_logger/simplelog/etc, all of which default to
# stderr, which is unusable here (see that module's docs).
log = { version = "0.4", features = ["std"] }

# Shared by every *native* backend (backend/native.rs on Linux,
# backend/macos.rs on macOS) — the ddc crate's traits, and the VESA MCCS
# capability-string/feature-database tables backend/mccs_shared.rs
# resolves feature names against. The `ddcutil` backend doesn't need any
# of this; its own C database does that job for it.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ddc = "0.2.2"
edid = "0.3"
mccs = "0.1.3"
mccs-caps = "0.1.3"
mccs-db = "0.1.3"

# Linux: talks /dev/i2c-* directly. We do our own `/dev/i2c-*`
# enumeration (backend::native) rather than pulling in ddc-i2c's
# `with-linux-enumerate`, so we skip its libudev/pkg-config build
# dependency entirely.
[target.'cfg(target_os = "linux")'.dependencies]
ddc-i2c = { version = "0.2.2", features = ["with-linux"] }

# macOS: talks IOKit (IOAVService on Apple Silicon, the older
# IOFramebuffer route on Intel) instead — see backend/macos.rs's docs.
[target.'cfg(target_os = "macos")'.dependencies]
ddc-macos = "0.2"

[profile.release]
lto = true
strip = true
