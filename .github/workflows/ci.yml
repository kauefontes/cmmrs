name: CI

on:
  push:
    # macos-volume-delay-fix: temporary, same reason as before — the only
    # way to compile-check a macOS-only change before a human verifies
    # it for real. Drop once that lands on main.
    branches: [main, macos-volume-delay-fix]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # ddcutil.rs's own tests are pure text-parsing fixtures and don't
    # need ddcutil actually installed to run on either platform. Windows
    # isn't here yet — no backend for it (see backend/mod.rs).
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      # #[ignore]d — manual_detect_probe, manual_probe_classifies_mute...
      # — need real DDC/CI hardware and stay skipped here by default.
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
