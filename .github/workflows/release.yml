name: Release binaries

# Attaches a prebuilt Linux binary to the GitHub Release for a `vX.Y.Z`
# tag — for anyone who'd rather grab a binary than `cargo install`/build
# from source. Deliberately does NOT touch crates.io: `cargo publish`
# stays a manual, local step (see packaging/aur/README.md and the commit
# history around the 0.1.0 release for why — a stored registry token in
# CI is exactly the kind of thing worth not adding for a low-frequency
# solo-maintainer release cadence).
on:
  push:
    tags: ['v*']
  # Manual re-run against any existing tag — mainly for backfilling a
  # release from before this workflow existed (workflows for a tag push
  # only trigger if they're already present at the commit the tag
  # points to, so v0.1.0 itself won't auto-trigger this one) or retrying
  # a failed build without pushing a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach binaries to'
        required: true

permissions:
  contents: write

jobs:
  build:
    # Linux x86_64 only for now, matching what CI actually builds/tests
    # (see ci.yml) — the only platform with a native backend today (see
    # backend/native.rs). aarch64 is plausible later but isn't
    # cross-compiled/verified anywhere yet, so it's not claimed here.
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch runs against whatever branch/ref you launch it
      # from (default main), not the tag itself — github.ref_name would
      # be wrong for that trigger, so resolve the real tag once here and
      # use it everywhere below instead.
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          staging="cmmrs-${{ steps.tag.outputs.name }}-x86_64-linux"
          mkdir "$staging"
          cp target/release/cmmrs README.md LICENSE "$staging/"
          tar -czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            cmmrs-${{ steps.tag.outputs.name }}-x86_64-linux.tar.gz
            cmmrs-${{ steps.tag.outputs.name }}-x86_64-linux.tar.gz.sha256
